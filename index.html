<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <style>
        body {
            background: #0a0a0a;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gamelayout {
            display: flex;
            gap: 30px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        canvas {
            border: 4px solid #333;
            background: #000;
            display: block;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 20px;
            min-width: 150px;
        }

        .stat-box {
            background: #252525;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #444;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
        }
    </styLe>
</head>
<body>
    <div class="game-layout" style="flex-direction: column; align-items: stretch;">
        
        <div class="top-panel" style="display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px;">
            <div class="stat-box" style="flex: 1;">
                <h3>Siguiente</h3>
                <canvas id="next" width="120" height="120"></canvas>
            </div>
            
            <div class="stat-box" style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <h3>Puntaje</h3>
                <div id="score-val" style="font-size: 32px; font-weight: bold; color: #00f0f0;">0</div>
            </div>
        </div>

        <div class="board-container" style="position: relative;">
            <canvas id="tetris" width="300" height="600"></canvas>

            <div id="game-over-overlay" style="
                display:none;
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.8);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                border-radius: 5px;">
                <h2 style="color: #ff4444; margin-bottom: 20px;">GAME OVER</h2>
                <button id="restart-btn" style="
                    padding: 10px 20px;
                    font-size: 18px;
                    background: #00f0f0;
                    border: none;
                    cursor: pointer;
                    font-weight: bold;
                    border-radius: 5px;">
                    RETRY
                </button>
            </div>
        </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
